name: NeoForge 1.21.1 and IC2R
on:
  push:
    branches: [neoforge-1.21.1]
  pull_request:
    branches: [neoforge-1.21.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build runGameTestServer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gravisuite-neoforge-1.21.1
          path: |
            build/libs/*.jar
            build/reports/tests/
            build/test-results/
            run/logs/
