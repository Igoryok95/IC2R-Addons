name: NeoForge 1.21.1 validation
on:
  push:
    branches: [main, experimental-compatibility-1.4.1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        compatibility: [base, buildcraft-jade]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check out the paired IC2R tool actions
        uses: actions/checkout@v4
        with:
          repository: Igoryok95/IC2R
          ref: cea891a9e5d68d70762bf1257d2e26f5ac45d293
          path: ic2r-core
      - name: Build the paired core
        working-directory: ic2r-core
        run: |
          chmod +x gradlew
          ./gradlew jar
      - run: chmod +x gradlew
      - name: Build and run unit tests
        run: ./gradlew build -Pic2rJar="$GITHUB_WORKSPACE/ic2r-core/build/libs/ic2-neoforge-21.1.95.jar" ${{ matrix.compatibility == 'buildcraft-jade' && '-PwithBC -PwithJade' || '' }}
      - name: Run server GameTests
        if: matrix.compatibility == 'base'
        run: ./gradlew runGameTestServer -Pic2rJar="$GITHUB_WORKSPACE/ic2r-core/build/libs/ic2-neoforge-21.1.95.jar" -PcombinedTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ic2r-addons-neoforge-1.21.1-${{ matrix.compatibility }}
          path: |
            build/libs/*.jar
            build/test-results/
            build/reports/tests/
            run/logs/
