name: NeoForge 1.21.1 validation
on:
  push:
    branches: [main, experimental-compatibility-1.4.1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        compatibility: [base, buildcraft-jade]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout matching IC2R development source
        uses: actions/checkout@v4
        with:
          repository: Igoryok95/IC2R
          ref: experimental-restoration-21.1.70
          path: ic2r-core
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build matching IC2R dependency
        working-directory: ic2r-core
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon jar
      - run: chmod +x gradlew
      - run: ./gradlew build runGameTestServer "-Pic2rJar=$GITHUB_WORKSPACE/ic2r-core/build/libs/ic2-neoforge-21.1.70.jar" ${{ matrix.compatibility == 'buildcraft-jade' && '-PwithBC -PwithJade' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ic2r-addons-neoforge-1.21.1-${{ matrix.compatibility }}
          path: |
            build/libs/*.jar
            build/test-results/
            build/reports/tests/
            run/logs/
