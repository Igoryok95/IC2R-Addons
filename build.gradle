plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'reforged.mods'
version = mod_version
base.archivesName = "gravisuite-neoforge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

repositories {
    mavenCentral()
    ivy {
        name = 'IC2RReleases'
        url = 'https://github.com/neo-industrial-mc/IC2R/releases/download'
        patternLayout { artifact '[revision]/[artifact]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'ic2r' }
    }
}

dependencies {
    if (providers.gradleProperty('ic2rJar').isPresent()) {
        implementation files(providers.gradleProperty('ic2rJar').get())
    } else {
        implementation "ic2r:ic2-neoforge:${ic2r_version}@jar"
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gravisuite'
        }
    }
    mods { gravisuite { sourceSet sourceSets.main } }
    unitTest { enable(); testedMod = mods.gravisuite }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
