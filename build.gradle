plugins {
 id 'java-library'
 id 'net.neoforged.moddev' version '2.0.141'
 id 'com.diffplug.spotless' version '8.8.0'
}
group = 'com.chocohead.advsolar'
version = mod_version
base.archivesName = 'solar-gravisuite-neoforge-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
spotless { java { target 'src/main/java/**/*.java', 'src/test/java/**/*.java'; googleJavaFormat('1.35.0') } }
repositories {
 mavenCentral()
 maven { url = 'https://maven.blamejared.com/' }
 ivy {
  url = 'https://github.com/Igoryok95/IC2R/releases/download'
  patternLayout { artifact '[revision]/[artifact]-[revision].[ext]' }
  metadataSources { artifact() }
  content { includeGroup 'ic2r' }
 }
}
dependencies {
 if (providers.gradleProperty('ic2rJar').isPresent()) implementation files(providers.gradleProperty('ic2rJar').get())
 else implementation "ic2r:ic2-neoforge:${ic2r_version}@jar"
 compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.64.0.455'
 runtimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.64.0.455'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
neoForge {
 version = neo_version
 runs {
  client { client(); if (providers.gradleProperty('clientSmoke').isPresent()) { systemProperty 'asp.clientSmoke', 'true'; programArguments.addAll '--quickPlaySingleplayer', 'SolarClientSmoke' } }
  server { server(); programArgument '--nogui' }
  gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'solar_gravisuite' }
 }
 mods { solar_gravisuite { sourceSet sourceSets.main } }
 unitTest { enable(); testedMod = mods.solar_gravisuite }
}
test { useJUnitPlatform(); systemProperty 'asp.projectDir', projectDir.absolutePath; systemProperty 'solar_gravisuite.projectDir', projectDir.absolutePath }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
 inputs.property 'version', project.version
 filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
