plugins {
 id 'java-library'
 id 'net.neoforged.moddev' version '2.0.141'
 id 'com.diffplug.spotless' version '8.8.0'
}
group = 'com.igoryok95.ic2raddons.solar'
version = mod_version
base.archivesName = 'ic2r-addons-neoforge-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
spotless { java { target 'src/main/java/**/*.java', 'src/test/java/**/*.java'; googleJavaFormat('1.35.0') } }
repositories {
 mavenCentral()
 maven { url = 'https://api.modrinth.com/maven' }
 ivy {
  url = 'https://github.com/BCCE-team/BuildCraft/releases/download'
  patternLayout { artifact '8.0.25/[artifact]-[revision].[ext]' }
  metadataSources { artifact() }
  content { includeGroup 'bcce' }
 }
 maven { url = 'https://maven.blamejared.com/' }
 ivy {
  url = 'https://github.com/Igoryok95/IC2R/releases/download'
  patternLayout { artifact '[revision]/[artifact]-[revision].[ext]' }
  metadataSources { artifact() }
  content { includeGroup 'ic2r' }
 }
}
dependencies {
    if (providers.gradleProperty('mekanismModsDir').isPresent()) {
        runtimeOnly fileTree(dir: providers.gradleProperty('mekanismModsDir').get(), includes: ['Mekanism-1.21.1-*.jar', 'almostunified-*.jar'])
    }

    if (providers.gradleProperty('createModsDir').isPresent()) {
        runtimeOnly fileTree(dir: providers.gradleProperty('createModsDir').get(), includes: ['create-*.jar', 'flywheel-*.jar', 'ponder-*.jar'])
    }

 compileOnly 'bcce:BuildCraft-Community-Edition:8.0.25+1.21.1+neoforge@jar'
 compileOnly 'maven.modrinth:jade:15.10.6+neoforge'
 if (providers.gradleProperty('withBC').isPresent()) runtimeOnly 'bcce:BuildCraft-Community-Edition:8.0.25+1.21.1+neoforge@jar'
 if (providers.gradleProperty('withJade').isPresent()) runtimeOnly 'maven.modrinth:jade:15.10.6+neoforge'
 if (providers.gradleProperty('ic2rJar').isPresent()) implementation files(providers.gradleProperty('ic2rJar').get())
 else implementation "ic2r:ic2-neoforge:${ic2r_version}@jar"
 compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.64.0.455'
 runtimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.64.0.455'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
neoForge {
 version = neo_version
 runs {
  client {
   client()
   if (providers.gradleProperty('restorationSmoke').isPresent()) {
    gameDirectory = layout.projectDirectory.dir('run/restoration-client')
    systemProperty 'ic2r_addons.restorationSmoke', 'true'
    systemProperty 'ic2r_addons.restorationStart', providers.gradleProperty('restorationStart').orElse('0').get()
    programArguments.addAll '--quickPlaySingleplayer', 'RestorationSmoke'
   }
   if (providers.gradleProperty('clientSmoke').isPresent() || providers.gradleProperty('machinesSmoke').isPresent() || providers.gradleProperty('controlSmoke').isPresent()) {
    systemProperty providers.gradleProperty('controlSmoke').isPresent() ? 'ic2r_addons.controlSmoke' : providers.gradleProperty('machinesSmoke').isPresent() ? 'ic2r_addons.machinesSmoke' : 'ic2r_addons.clientSmoke', 'true'
    systemProperty 'ic2r_addons.controlTickStride', providers.gradleProperty('controlQuick').isPresent() ? '1' : '5'
    programArguments.addAll '--quickPlaySingleplayer', 'SolarClientSmoke'
   }
  }
  server { server(); programArgument '--nogui' }
  gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('combinedTests').isPresent() ? 'ic2,ic2r_addons' : 'ic2r_addons' }
 }
 mods { ic2r_addons { sourceSet sourceSets.main } }
 unitTest { enable(); testedMod = mods.ic2r_addons }
}
test { useJUnitPlatform(); systemProperty 'ic2r_addons.projectDir', projectDir.absolutePath }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
 inputs.property 'version', project.version
 filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
